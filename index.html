            if (!url) return '';

            if (fileIdMatch && fileIdMatch[1]) {
                return `https://lh3.googleusercontent.com/d/${fileIdMatch[1]}`;
            }
            return url;
        };

        // COUNTDOWN TIMER COMPONENT
        function BirthdayCountdown({ targetMonth, targetDay }) {
            const [timeLeft, setTimeLeft] = useState({ days: 0, hours: 0, minutes: 0, seconds: 0 });

            useEffect(() => {
                const calculateTimeLeft = () => {
                    const now = new Date();
                    let targetYear = now.getFullYear();
                    let target = new Date(targetYear, targetMonth - 1, targetDay);

                    if (now > target) {
                        target = new Date(targetYear + 1, targetMonth - 1, targetDay);
                    }

                    const diff = target - now;

                    if (diff > 0) {
                        setTimeLeft({
                            days: Math.floor(diff / (1000 * 60 * 60 * 24)),
                            hours: Math.floor((diff / (1000 * 60 * 60)) % 24),
                            minutes: Math.floor((diff / 1000 / 60) % 60),
                            seconds: Math.floor((diff / 1000) % 60)
                        });
                    }
                };

                calculateTimeLeft();
                const timer = setInterval(calculateTimeLeft, 1000);
                return () => clearInterval(timer);
            }, [targetMonth, targetDay]);

            return (
                <div className="flex justify-center gap-3 md:gap-6 pt-2">
                    {[
                        { label: 'Days', val: timeLeft.days },
                        { label: 'Hours', val: timeLeft.hours },
                        { label: 'Mins', val: timeLeft.minutes },
                        { label: 'Secs', val: timeLeft.seconds }
                    ].map((item, idx) => (
                        <div key={idx} className="bg-amber-950/90 border border-yellow-500/40 p-3 md:p-4 rounded-2xl min-w-[70px] md:min-w-[90px] text-center shadow-lg backdrop-blur-md">
                            <span className="text-xl md:text-3xl font-extrabold text-yellow-400 block">{item.val}</span>
                            <span className="text-[10px] md:text-xs text-amber-200/80 font-bold uppercase tracking-wider">{item.label}</span>
                        </div>
                    ))}
                </div>
            );
        }

                                <div className="bg-amber-950/90 border border-yellow-500/40 p-6 md:p-8 rounded-3xl space-y-6 shadow-2xl">
                                    <div className="flex justify-between items-center text-xs font-bold text-yellow-400">
                                        <span>Question {currentQuizIdx + 1} of {LOVE_QUIZ_QUESTIONS.length}</span>
                                        <span>Score: {quizScore} 🌻</span>
                                    </div>

                                    <h3 className="text-lg md:text-xl font-extrabold text-white">
                                        {LOVE_QUIZ_QUESTIONS[currentQuizIdx].q}
                                    </h3>

                                    <div className="grid grid-cols-1 gap-3">
                                        {LOVE_QUIZ_QUESTIONS[currentQuizIdx].options.map((opt, oIdx) => (
                                            <button
                                                key={oIdx}
                                                onClick={() => handleQuizSelect(currentQuizIdx, oIdx)}
                                                className="w-full text-left p-4 rounded-2xl bg-amber-900/60 hover:bg-yellow-500 hover:text-slate-950 border border-yellow-500/30 font-semibold text-sm transition-all"
                                            >
                                                {opt}
                                            </button>
                                        ))}
                                    </div>
                                </div>
                            ) : (
                                <div className="bg-amber-950/90 border border-yellow-500/40 p-8 rounded-3xl text-center space-y-4 shadow-2xl">
                                    <div className="text-5xl">🥳 🌻</div>
                                    <h3 className="text-2xl font-bold text-white">Love Quiz Completed!</h3>
                                    <p className="text-yellow-400 font-extrabold text-lg">
                                        You scored {quizScore} out of {LOVE_QUIZ_QUESTIONS.length}! 🎉
                                    </p>
                                    <p className="text-amber-200 text-xs max-w-sm mx-auto leading-relaxed">
                                        No matter the score, Ravindu's love for Chuti is 100% infinite forever! 💖
                                    </p>
                                    <button 
                                        onClick={() => {
                                            setCurrentQuizIdx(0);
                                            setQuizScore(0);
                                            setQuizFinished(false);
                                        }}
                                        className="px-6 py-2.5 bg-yellow-500 text-slate-950 font-bold text-xs rounded-xl hover:bg-yellow-400"
                                    >
                                        Play Again 🔄
                                    </button>
                                </div>
                            )}
                        </div>
                    )}

                    {/* TAB 6: PLAYLIST & VOICE NOTES */}
                    {activeTab === 'music' && (
                        <div className="space-y-6 animate-fadeIn">
                            <div className="bg-amber-900/60 p-5 rounded-3xl border border-yellow-500/30">
                                <h2 className="text-xl md:text-2xl font-bold text-white">Chuti & Ravindu's Romantic Playlist 🎧</h2>
                                <p className="text-amber-200 text-xs">Special tracks & voice notes recorded for you 🌻</p>
                            </div>

                            <div className="space-y-3">
                                {userPlaylist.map((track) => (
                                    <div key={track.id} className="bg-amber-950/90 border border-yellow-500/30 p-4 rounded-2xl flex flex-col sm:flex-row sm:items-center justify-between gap-3 shadow-lg">
                                        <div className="space-y-1">
                                            <h4 className="text-xs md:text-sm font-bold text-white">{track.title}</h4>
                                            <p className="text-[11px] text-yellow-400/80">{track.artist}</p>
                                        </div>
                                        <audio 
                                            controls 
                                            preload="metadata"
                                            src={getDriveMediaStreamUrl(track.audioUrl)} 
                                            className="w-full sm:w-64 h-9" 
                                        />
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}

                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
