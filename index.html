<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hey Sunflower, This Surprise Is For You 🌻</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Yesteryear&display=swap');
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #2e1005;
            color: #fef3c7;
        }
        .font-handwriting {
            font-family: 'Yesteryear', cursive;
        }
        /* Custom scrollbars */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #1c0a00;
        }
        ::-webkit-scrollbar-thumb {
            background: #d97706;
            border-radius: 4px;
        }
        @keyframes floatDown {
            0% { transform: translateY(-20px) rotate(0deg); opacity: 0.8; }
            50% { transform: translateY(400px) rotate(180deg); opacity: 1; }
            100% { transform: translateY(800px) rotate(360deg); opacity: 0; }
        }
        .floating-cheese-particle {
            position: absolute;
            animation: floatDown 6s linear infinite;
            pointer-events: none;
        }
    </style>
</head>
<body class="selection:bg-yellow-500 selection:text-slate-950">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // Drive Helper function to convert ANY Google Drive share link to direct high-res web viewable link
        const convertDriveLinkToDirect = (url) => {
            if (!url) return '';
            if (url.startsWith('data:') || url.includes('lh3.googleusercontent.com')) return url;
            
            // Extract file ID from various Google Drive share link formats
            const match = url.match(/\/d\/([a-zA-Z0-9_-]+)/) || url.match(/id=([a-zA-Z0-9_-]+)/);
            if (match && match[1]) {
                return `https://lh3.googleusercontent.com/d/${match[1]}=s1600`;
            }
            return url;
        };

        // Embedded initial photos from your shared drive folders so every viewer sees them globally!
        const DEFAULT_BANNER_PHOTOS = [
            "https://images.unsplash.com/photo-1518199266791-5375a83190b7?q=80&w=1200&auto=format&fit=crop",
            "https://images.unsplash.com/photo-1516589178581-6cd7833ae3b2?q=80&w=1200&auto=format&fit=crop",
            "https://images.unsplash.com/photo-1522673607200-164d1b6ce486?q=80&w=1200&auto=format&fit=crop"
        ];

        function App() {
            const [hasEnteredSite, setHasEnteredSite] = useState(false);
            const [activeTab, setActiveTab] = useState('home');
            const [isLockedUntilBirthday, setIsLockedUntilBirthday] = useState(true);
            const [isAdminUnlocked, setIsAdminUnlocked] = useState(false);
            const [showLockedModal, setShowLockedModal] = useState(false);
            const [lockedItemName, setLockedItemName] = useState('');
            const [floatingHearts, setFloatingHearts] = useState([]);

            // Header Background Photo State
            const [headerBgImage, setHeaderBgImage] = useState(() => {
                return localStorage.getItem('chuti_header_bg') || null;
            });

            // Default photos combined with locally saved custom links
            const [bannerImages, setBannerImages] = useState(() => {
                const saved = localStorage.getItem('chuti_banner_images');
                if (saved) {
                    try {
                        const parsed = JSON.parse(saved);
                        if (parsed.length > 0) return parsed;
                    } catch(e) {}
                }
                return DEFAULT_BANNER_PHOTOS;
            });
            const [currentBannerIndex, setCurrentBannerIndex] = useState(0);

            // Open When Cards State
            const [openWhenCards, setOpenWhenCards] = useState([
                { id: 1, mood: 'Open when you miss me 🥺', title: 'When The Distance Feels Too Far...', description: 'Read this whenever you miss my hugs.', photo: null, text: 'චූටි බබා, මම හැම තිස්සෙම ඔයා ලඟින් ඉන්නවා. දුරින් හිටියත් මගේ මුලු හදවතම තියෙන්නේ ඔයා ලඟ! ❤️', music: null },
                { id: 2, mood: 'Open on Birthday Morning 🎂', title: 'Good Morning My Birthday Princess! 🌻', description: 'Start your special day with my love.', photo: null, text: 'සුබ උපන්දිනයක් වේවා මගේ සුන්දර සූරියකාන්ත මලට! 🎂🌻 අද දවස ඔයාගේ ලස්සනම දවස කරගන්න!', music: null },
                { id: 3, mood: 'Open when you feel sad 🥺', title: 'I Am Always Here For You 🤗', description: 'Let me put a smile back on your cute face.', photo: null, text: 'දුක් වෙන්න එපා මැණික. ඔයාට මම ඉන්නවා හැමදාම. මගේ පැටියා හිනාවෙලා ඉන්නකොට තමා ලස්සනම! ❤️', music: null },
                { id: 4, mood: 'Open before going to sleep 🌙', title: 'Sweet Dreams My Love 😴', description: 'A cozy bed-time message from Ravindu.', photo: null, text: 'පරිස්සමින් නිදාගන්න මගේ චූටි බබා. හෙට තවත් ලස්සන දවසක් වේවි. Good Night Ummaaa! 💋', music: null }
            ]);

            // Audio Playlist State
            const [userPlaylist, setUserPlaylist] = useState([
                { id: 1, title: 'Our Love Story Voice Note', artist: 'Ravindu to Himaya 🌻', audioUrl: null }
            ]);

            // Background Music State for Sinhala Love Letter
            const [letterBgMusic, setLetterBgMusic] = useState(() => {
                return localStorage.getItem('chuti_letter_music') || null;
            });

            // Photo Gallery State
            const [galleryPhotos, setGalleryPhotos] = useState(() => {
                const saved = localStorage.getItem('chuti_gallery_photos');
                return saved ? JSON.parse(saved) : [];
            });

            // Save Banner Images to LocalStorage safely
            const saveBannerImagesToStorage = (imagesArray) => {
                try {
                    localStorage.setItem('chuti_banner_images', JSON.stringify(imagesArray));
                } catch (e) {
                    console.warn("Storage Limit Reached!", e);
                }
            };

            // Banner 5-second auto slideshow
            useEffect(() => {
                if (bannerImages.length <= 1) return;
                const timer = setInterval(() => {
                    setCurrentBannerIndex(prevIndex => (prevIndex + 1) % bannerImages.length);
                }, 5000);
                return () => clearInterval(timer);
            }, [bannerImages.length]);

            const triggerHeart = (e) => {
                const newHeart = {
                    id: Date.now() + Math.random(),
                    x: e.clientX,
                    y: e.clientY
                };
                setFloatingHearts(prev => [...prev.slice(-10), newHeart]);
            };

            const handleProtectedClick = (targetTab, name) => {
                if (isLockedUntilBirthday) {
                    setLockedItemName(name);
                    setShowLockedModal(true);
                } else {
                    setActiveTab(targetTab);
                }
            };

            const handleAddDriveLink = (target) => {
                const link = prompt("Paste your Google Drive Photo Share Link (Ensure permission is 'Anyone with link'):");
                if (link) {
                    const directUrl = convertDriveLinkToDirect(link);
                    if (target === 'banner') {
                        const updated = [directUrl, ...bannerImages];
                        setBannerImages(updated);
                        saveBannerImagesToStorage(updated);
                        alert("Drive Photo Link added to Banner! 🌻");
                    } else {
                        const newPhoto = {
                            id: Date.now(),
                            title: `Sunflower Memory ${galleryPhotos.length + 1}`,
                            category: 'Favorites',
                            url: directUrl,
                            caption: 'Chuti & Ravindu 🌻❤️'
                        };
                        const updated = [newPhoto, ...galleryPhotos];
                        setGalleryPhotos(updated);
                        localStorage.setItem('chuti_gallery_photos', JSON.stringify(updated));
                        alert("Drive Photo Link added to Gallery! 🌻");
                    }
                }
            };

            return (
                <div className="min-h-screen relative overflow-x-hidden pb-20" onClick={triggerHeart}>
                    
                    {/* Floating Heart / Sunflower Particles on Click */}
                    {floatingHearts.map(h => (
                        <span 
                            key={h.id} 
                            className="fixed pointer-events-none text-yellow-400 text-2xl animate-ping z-50"
                            style={{ left: `${h.x - 12}px`, top: `${h.y - 12}px` }}
                        >
                            🌻
                        </span>
                    ))}

                    {/* CUTE LOCKED MODAL */}
                    {showLockedModal && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-md" onClick={() => setShowLockedModal(false)}>
                            <div className="bg-amber-950 border-2 border-yellow-500/60 rounded-3xl max-w-sm w-full p-6 text-center space-y-4 shadow-2xl relative" onClick={e => e.stopPropagation()}>
                                <div className="w-16 h-16 rounded-full bg-yellow-500/20 border border-yellow-500/50 flex items-center justify-center text-yellow-400 mx-auto text-2xl">
                                    🔒
                                </div>
                                <h3 className="text-xl font-extrabold text-white">දැන් මේක අරින්න බෑ! 🎂✨</h3>
                                <p className="text-yellow-300 font-semibold text-sm">Shooo Panchi, Birthday එක වෙනකන් ඉන්න! 🙈💖</p>
                                <p className="text-amber-200 text-xs bg-amber-900/60 p-4 rounded-2xl italic border border-amber-800">
                                    "Ravindu has locked <strong>"{lockedItemName}"</strong> until your birthday countdown reaches 00:00! Sweet things come to those who wait, Chuti! 🌻"
                                </p>
                                <button 
                                    onClick={() => setShowLockedModal(false)}
                                    className="w-full py-3 rounded-xl bg-gradient-to-r from-yellow-400 to-amber-500 text-slate-950 font-black text-sm shadow-lg hover:scale-105 transition-all"
                                >
                                    හරි, මම ඉන්නම්! (Okay, I'll wait! 💖)
                                </button>
                            </div>
                        </div>
                    )}

                    {/* FIRST PAGE WELCOME SCREEN */}
                    {!hasEnteredSite && (
                        <div className="fixed inset-0 z-50 bg-amber-950 flex flex-col items-center justify-center p-6 text-center">
                            <div className="max-w-md w-full bg-amber-900/80 border border-yellow-500/40 p-8 rounded-3xl shadow-2xl space-y-6 backdrop-blur-md">
                                <div className="w-24 h-24 rounded-full bg-yellow-500/20 border-2 border-yellow-500/50 flex items-center justify-center text-5xl mx-auto animate-bounce">
                                    🌻
                                </div>
                                <span className="text-yellow-400 text-xs font-bold tracking-widest uppercase bg-yellow-500/10 py-1 px-4 rounded-full border border-yellow-500/30 inline-block">
                                    From Ravindu to Himaya (Chuti) 💖
                                </span>
                                <h1 className="text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-yellow-200 via-amber-300 to-yellow-400">
                                    hey sunflower this surprise is for you.. 🌻✨
                                </h1>
                                <button 
                                    onClick={() => setHasEnteredSite(true)}
                                    className="w-full py-4 rounded-2xl bg-gradient-to-r from-yellow-400 via-amber-500 to-yellow-500 text-slate-950 font-black text-base shadow-xl hover:scale-105 transition-all"
                                >
                                    Open Sunflower Surprise 🌻
                                </button>
                            </div>
                        </div>
                    )}

                    {/* MAIN CONTENT AREA */}
                    <div className="max-w-4xl mx-auto px-4 py-8">
                        
                        {/* HEADER & COUNTDOWN */}
                        <header 
                            className="bg-amber-900/80 border border-yellow-500/40 rounded-3xl p-6 md:p-8 text-center shadow-2xl relative mb-8 backdrop-blur-md bg-cover bg-center transition-all duration-500"
                            style={headerBgImage ? { backgroundImage: `linear-gradient(to bottom, rgba(30, 15, 5, 0.8), rgba(30, 15, 5, 0.95)), url(${headerBgImage})` } : {}}
                        >
                            <div className="absolute top-4 right-4 flex items-center gap-2">
                                <button 
                                    onClick={() => {
                                        if (isAdminUnlocked) {
                                            setIsAdminUnlocked(false);
                                            alert("Admin Mode Locked 🔒");
                                        } else {
                                            const pin = prompt("Enter Admin Passcode:");
                                            if (pin === "111126") {
                                                setIsAdminUnlocked(true);
                                                setIsLockedUntilBirthday(false);
                                                alert("Admin Access Unlocked 🔓! You can now add & upload photos live.");
                                            } else if (pin !== null) {
                                                alert("Incorrect Passcode!");
                                            }
                                        }
                                    }}
                                    className={`px-3 py-1.5 rounded-full text-xs font-bold border transition-all ${
                                        isAdminUnlocked ? 'bg-emerald-950 text-emerald-300 border-emerald-500/60' : 'bg-amber-950 text-amber-300 border-amber-500/60'
                                    }`}
                                >
                                    {isAdminUnlocked ? 'Admin Mode: ACTIVE 🔓' : 'Admin Lock 🔒'}
                                </button>
                            </div>

                            {/* ADMIN ONLY: Live Photo Import Controls */}
                            {isAdminUnlocked && (
                                <div className="absolute top-4 left-4 z-20 flex flex-wrap gap-2">
                                    <button
                                        onClick={() => handleAddDriveLink('banner')}
                                        className="px-3 py-1.5 rounded-full bg-yellow-400 text-slate-950 hover:bg-yellow-300 text-xs font-extrabold shadow-md flex items-center gap-1"
                                    >
                                        + Add Photo via Drive Link 🔗
                                    </button>
                                </div>
                            )}

                            <div className="space-y-4 pt-4">
                                <span className="text-yellow-400 text-xs font-bold uppercase tracking-widest bg-yellow-500/10 px-4 py-1.5 rounded-full border border-yellow-500/30 inline-block">
                                    Happy Birthday Sunflower Himaya (Chuti)! 🌻
                                </span>
                                <h1 className="text-3xl md:text-5xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-yellow-200 via-amber-300 to-yellow-400">
                                    Chuti's Birthday Surprise 🌻✨
                                </h1>
                                <p className="text-amber-200 text-xs md:text-sm">
                                    Birthday: 2006.11.11 | Special Anniversary: 2026.01.19
                                </p>
                                <CountdownTimer targetMonth={11} targetDay={11} />
                            </div>
                        </header>

                        {/* NAV BUTTONS */}
                        <nav className="flex justify-center gap-2 overflow-x-auto pb-4 mb-8">
                            {[
                                { id: 'home', label: 'Surprise Hub 🌻', locked: false },
                                { id: 'letter', label: 'My Letter 📜', locked: true },
                                { id: 'gallery', label: 'Photo Gallery 🖼️', locked: true },
                                { id: 'openwhen', label: 'Open When 💌', locked: true },
                                { id: 'music', label: 'Playlist & Music 🎧', locked: true }
                            ].map(tab => (
                                <button
                                    key={tab.id}
                                    onClick={() => tab.locked && isLockedUntilBirthday ? handleProtectedClick(tab.id, tab.label) : setActiveTab(tab.id)}
                                    className={`px-4 py-2.5 rounded-2xl text-xs font-bold whitespace-nowrap transition-all ${
                                        activeTab === tab.id 
                                            ? 'bg-gradient-to-r from-yellow-400 to-amber-500 text-slate-950 shadow-lg scale-105' 
                                            : 'bg-amber-950/80 text-amber-200 border border-amber-900 hover:bg-amber-900'
                                    }`}
                                >
                                    {tab.label} {tab.locked && isLockedUntilBirthday && '🔒'}
                                </button>
                            ))}
                        </nav>

                        {/* TAB 1: HOME SURPRISE HUB */}
                        {activeTab === 'home' && (
                            <div className="space-y-6">
                                {/* Banner Carousel (Rotates every 5s) */}
                                <div className="relative h-64 md:h-96 rounded-3xl overflow-hidden border border-yellow-500/30 bg-amber-950 shadow-2xl">
                                    {bannerImages.length > 0 ? (
                                        bannerImages.map((img, idx) => (
                                            <div key={idx} className={`absolute inset-0 transition-opacity duration-1000 ${
                                                idx === currentBannerIndex ? 'opacity-100 z-10' : 'opacity-0 z-0 pointer-events-none'
                                            }`}>
                                                <img 
                                                    src={convertDriveLinkToDirect(img)} 
                                                    className="w-full h-full object-cover"
                                                />
                                                {/* ADMIN ONLY: Delete Current Banner Image Button */}
                                                {isAdminUnlocked && (
                                                    <button
                                                        onClick={() => {
                                                            if (confirm("Remove this photo from the banner?")) {
                                                                const updated = bannerImages.filter((_, i) => i !== idx);
                                                                setBannerImages(updated);
                                                                saveBannerImagesToStorage(updated);
                                                                setCurrentBannerIndex(0);
                                                            }
                                                        }}
                                                        className="absolute top-4 right-4 z-30 p-2 bg-red-600/90 hover:bg-red-700 text-white rounded-full shadow-lg border border-red-400 text-xs flex items-center gap-1 font-bold"
                                                        title="Delete Banner Photo"
                                                    >
                                                        🗑️ Delete Photo
                                                    </button>
                                                )}
                                            </div>
                                        ))
                                    ) : (
                                        <div className="w-full h-full flex flex-col items-center justify-center text-center p-6 bg-amber-950/90">
                                            <div className="w-16 h-16 rounded-full bg-yellow-500/10 border border-yellow-500/30 flex items-center justify-center text-yellow-400 text-3xl mb-3 animate-pulse">
                                                🌻
                                            </div>
                                            <h3 className="text-lg font-bold text-white mb-1">No Banner Photos Added Yet</h3>
                                            <p className="text-amber-200/70 text-xs max-w-sm">
                                                {isAdminUnlocked 
                                                    ? 'Click "Admin Upload Photos" or "+ Drive Link" above to add photos!' 
                                                    : 'Unlock Admin Mode (🔒 Passcode: 111126) to upload your photos!'}
                                            </p>
                                        </div>
                                    )}
                                    
                                    {/* ADMIN ONLY: Banner Upload Options */}
                                    {isAdminUnlocked && (
                                        <div className="absolute top-4 left-4 z-20 flex flex-wrap gap-2">
                                            <label className="px-3 py-1.5 rounded-full bg-amber-950/90 hover:bg-amber-900 border border-yellow-500/40 text-xs text-yellow-300 font-bold cursor-pointer shadow-md flex items-center gap-1 backdrop-blur-md">
                                                📷 Admin Upload Photos (Multiple)
                                                <input 
                                                    type="file" 
                                                    accept="image/*" 
                                                    multiple
                                                    onChange={(e) => {
                                                        const files = Array.from(e.target.files);
                                                        if (files.length > 0) {
                                                            let newImages = [];
                                                            let count = 0;
                                                            files.forEach(file => {
                                                                const reader = new FileReader();
                                                                reader.onloadend = () => {
                                                                    newImages.push(reader.result);
                                                                    count++;
                                                                    if (count === files.length) {
                                                                        const updated = [...newImages, ...bannerImages];
                                                                        setBannerImages(updated);
                                                                        saveBannerImagesToStorage(updated);
                                                                        setCurrentBannerIndex(0);
                                                                        alert(`${files.length} Banner Photos Added Successfully! 🌻 Slide setup is ready.`);
                                                                    }
                                                                };
                                                                reader.readAsDataURL(file);
                                                            });
                                                        }
                                                    }} 
                                                    className="hidden" 
                                                />
                                            </label>
                                            <button 
                                                onClick={() => handleAddDriveLink('banner')}
                                                className="px-3 py-1.5 rounded-full bg-amber-950/90 border border-yellow-500/40 text-xs text-yellow-300 font-bold hover:bg-amber-900 shadow-md backdrop-blur-md"
                                            >
                                                + Drive Link
                                            </button>
                                        </div>
                                    )}

                                    {bannerImages.length > 0 && (
                                        <div className="absolute bottom-4 right-4 z-20 flex items-center gap-1.5 bg-amber-950/80 px-3 py-1.5 rounded-full border border-yellow-500/30 backdrop-blur-md">
                                            <span className="text-[10px] text-yellow-400 font-bold mr-1">
                                                {currentBannerIndex + 1} / {bannerImages.length}
                                            </span>
                                            {bannerImages.map((_, idx) => (
                                                <button
                                                    key={idx}
                                                    onClick={() => setCurrentBannerIndex(idx)}
                                                    className={`h-2 rounded-full transition-all ${
                                                        idx === currentBannerIndex ? 'bg-yellow-400 w-5' : 'bg-amber-700 w-2'
                                                    }`}
                                                />
                                            ))}
                                        </div>
                                    )}

                                    <div className="absolute inset-0 bg-gradient-to-t from-amber-950 via-amber-950/30 to-transparent p-6 flex flex-col justify-end pointer-events-none z-10">
                                        <h2 className="text-2xl font-extrabold text-white">To My Dearest Chuti 🌻</h2>
                                        <p className="text-amber-200 text-xs">Swipeable memories & 5-second automatic slideshow</p>
                                    </div>
                                </div>

                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    <div 
                                        onClick={() => handleProtectedClick('letter', 'My Love Letter')}
                                        className="bg-amber-900/60 border border-yellow-500/30 p-6 rounded-3xl cursor-pointer hover:border-yellow-400 transition-all"
                                    >
                                        <h3 className="text-lg font-bold text-white mb-1">My Love Letter 📜</h3>
                                        <p className="text-amber-200/80 text-xs">Read my handwritten animated Sinhala letter with melting cheese, hearts & background music!</p>
                                    </div>
                                    <div 
                                        onClick={() => handleProtectedClick('gallery', 'Photo Gallery')}
                                        className="bg-amber-900/60 border border-yellow-500/30 p-6 rounded-3xl cursor-pointer hover:border-yellow-400 transition-all"
                                    >
                                        <h3 className="text-lg font-bold text-white mb-1">Photo Gallery 🖼️</h3>
                                        <p className="text-amber-200/80 text-xs">Our romantic album photos & uploaded memories together.</p>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* TAB 2: ANIMATED SINHALA LETTER WITH BACKGROUND MUSIC PLAYER */}
                        {activeTab === 'letter' && (
                            <SinhalaLetter 
                                isAdminUnlocked={isAdminUnlocked}
                                letterBgMusic={letterBgMusic}
                                setLetterBgMusic={setLetterBgMusic}
                            />
                        )}

                        {/* TAB 3: GALLERY */}
                        {activeTab === 'gallery' && (
                            <div className="space-y-6">

        // ANIMATED TYPEWRITER SINHALA LETTER WITH BACKGROUND MUSIC PLAYER
        function SinhalaLetter({ isAdminUnlocked, letterBgMusic, setLetterBgMusic }) {
            const letterText = `චූටි බබා,මට වෙන කරන්න දෙයක් මතක් වෙන්නෙ නෑ🙃 ...මම හිතනව මේ දෙයින් ඔයා සතුටු වෙයි කියල🙈 ...මම ඔයාට ආදරේ තරම කියාගන්න බෑ.❤️🥺🌍.මේ වෙලාවෙත් ඔයාගෙ birthday එකට වෙලාව ලං වෙද්දි මගෙ පපුව හයියෙන් ගැහෙනව.ඔයා තමයි මම හෙව්ව කෙනා කියල මට තේරුනේ ටික ටික අපි දෙන්න ආදරේ කරද්දි.මට ආදර කතා හිතල ලියන්න බෑ ඔයා වගේ 🥲.ඒත් මම ගොඩක් ආදරෙයි.❤️මට ඒක කියාගන්න තේරෙන්නෙ නෑ.ඔයාව මේ ලෝකෙ ලස්සනටම සතුටෙන්ම ඉන්න කෙල්ල කරන්නයි මට ඕන හැම තිස්සෙම.ඔයා ඇතුළෙ ඉන්න ඒ ලස්සන හුරතල් දඟකාර කෙල්ලට මම ආදරෙයි පිස්සුවෙන් වගේ.❤️🌍.මං දන්නව ඔයත් මට ගොඩක් ආදරෙයි.අපි දෙන්න අපි දෙන්නගෙ හීන ලස්සනට හැබෑ කරගමු මැණික ❤️🌍.මාව වැටෙන තැන් වලදි මට හයියක් වෙන කෙනෙක් මට ඔන උනේ 0 ඉඳන් හැම එකම හැබෑ කරගන්න.එතකන් මට හයියක් වෙන්න පුලුවන් කෙනෙක් මට හම්බුනා කියල හිතෙනව.මම ගොඩාආආආආඅක්ක් ආදරෙයි.අපි තව මේ වගේ ලස්සන උපන්දින ගොඩක් එකට සමරමු.❤️🌍I love my sunflower 🌻 .ummmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmaaaaaaaahhhhh.❤️❤️🌍`;

            const [displayed, setDisplayed] = useState('');
            const [idx, setIdx] = useState(0);

            useEffect(() => {
                if (idx < letterText.length) {
                    const t = setTimeout(() => {

            return (
                <div className="bg-amber-900/60 border border-yellow-500/40 p-6 md:p-8 rounded-3xl relative overflow-hidden shadow-2xl space-y-4">

                                    type="file" 
                                    accept="audio/*" 
                                    onChange={(e) => {
                                        const file = e.target.files[0];
                                        if (file) {
                                            const reader = new FileReader();
                                            reader.onloadend = () => {
                                                setLetterBgMusic(reader.result);
                                                try {
                                                    localStorage.setItem('chuti_letter_music', reader.result);
                                                    alert("Background music added for the letter! 🎵");
                                                } catch (err) {
                                                    console.warn("Storage full for audio file", err);
                                                }
                                            };
                                            reader.readAsDataURL(file);
                                        }
                                    }} 
                                    className="hidden" 
                                />
                            </label>
                        )}

                    <div className="bg-amber-950/80 border border-yellow-500/30 p-6 rounded-2xl text-amber-100 text-sm md:text-base leading-relaxed whitespace-pre-line font-medium min-h-[220px] relative">
                        {/* Melting Cheese & Heart particle effects */}
                        <div className="absolute top-2 right-4 text-xl animate-bounce">🧀</div>
                        <div className="absolute bottom-2 left-4 text-xl animate-pulse">❤️</div>

                        {displayed}
                        {idx < letterText.length && (
                            <span className="inline-block w-2 h-5 bg-yellow-400 ml-1 animate-pulse" />
                        )}
                    </div>
                </div>
            );
        }

        // COUNTDOWN TIMER COMPONENT
        function CountdownTimer({ targetMonth, targetDay }) {
            const [timeLeft, setTimeLeft] = useState({ days: 0, hours: 0, minutes: 0, seconds: 0 });

            useEffect(() => {
                const calculateTime = () => {
                    const now = new Date();
                    let targetYear = now.getFullYear();
                    let target = new Date(targetYear, targetMonth - 1, targetDay);

                    if (now > target) {
                        target = new Date(targetYear + 1, targetMonth - 1, targetDay);
                    }

                    const diff = target - now;
                    if (diff > 0) {
                        setTimeLeft({
                            days: Math.floor(diff / (1000 * 60 * 60 * 24)),
                            hours: Math.floor((diff / (1000 * 60 * 60)) % 24),
                            minutes: Math.floor((diff / (1000 * 60)) % 60),
                            seconds: Math.floor((diff / 1000) % 60)
                        });
                    }
                };

                calculateTime();
                const timer = setInterval(calculateTime, 1000);
                return () => clearInterval(timer);
            }, [targetMonth, targetDay]);

            return (
                <div className="flex justify-center gap-2 md:gap-4 pt-2">
                    {[
                        { label: 'Days', val: timeLeft.days },
                        { label: 'Hours', val: timeLeft.hours },
                        { label: 'Mins', val: timeLeft.minutes },
                        { label: 'Secs', val: timeLeft.seconds }
                    ].map((item, i) => (
                        <div key={i} className="bg-amber-950/90 border border-yellow-500/40 px-3 py-2 md:px-4 md:py-3 rounded-2xl min-w-[65px] md:min-w-[80px] text-center shadow-lg">
                            <span className="text-lg md:text-2xl font-extrabold text-yellow-400 block">{item.val}</span>
                            <span className="text-[10px] text-amber-200/80 font-bold uppercase tracking-wider">{item.label}</span>
                        </div>
                    ))}
                </div>
            );
        }

        // Render React Application
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
