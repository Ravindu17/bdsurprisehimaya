            if (!url) return '';
            if (url.startsWith('data:') || url.includes('lh3.googleusercontent.com')) return url;
            
            // Extract standard Google Drive file ID
            const match = url.match(/\/d\/([a-zA-Z0-9_-]+)/) || url.match(/id=([a-zA-Z0-9_-]+)/);
            if (match && match[1]) {
                return `https://lh3.googleusercontent.com/d/${match[1]}=s1600`;
            }
            return url;
        };

                { id: 2, mood: 'Open on Birthday Morning 🎂', title: 'Good Morning My Birthday Princess! 🌻', description: 'Start your special day with my love.', text: 'සුබ උපන්දිනයක් වේවා මගේ සුන්දර සූරියකාන්ත මලට! 🎂🌻 අද දවස ඔයාගේ ලස්සනම දවස කරගන්න!' },

                { id: 4, mood: 'Open before going to sleep 🌙', title: 'Sweet Dreams My Love 😴', description: 'A cozy bed-time message from Ravindu.', text: 'පරිස්සමින් නිදාගන්න මගේ චූටි බබා. හෙට තවත් ලස්සන දවසක් වේවි. Good Night Ummaaa! 💋' }

            const [userPlaylist, setUserPlaylist] = useState(() => {

                } catch (e) {

            };

            // 5-Second Auto Banner Slide Rotation

                const timer = setInterval(() => {

            }, [bannerImages.length]);

            useEffect(() => {

                    setCurrentHeaderBgIndex(prev => (prev + 1) % headerBackgroundPhotos.length);

                            {[
                                { id: 'home', label: 'Surprise Hub 🌻', locked: false },
                                { id: 'letter', label: 'My Letter 📜', locked: true },
                                { id: 'gallery', label: 'Photo Gallery 🖼️', locked: true },
                                { id: 'openwhen', label: 'Open When 💌', locked: true },
                                { id: 'music', label: 'Playlist 🎧', locked: true }
                            ].map(tab => (
                                <button
                                    key={tab.id}
                                    onClick={() => tab.locked && isLockedUntilBirthday ? handleProtectedClick(tab.id, tab.label) : setActiveTab(tab.id)}
                                    className={`px-4 py-2.5 rounded-2xl text-xs font-bold whitespace-nowrap transition-all ${
                                        activeTab === tab.id 
                                            ? 'bg-gradient-to-r from-yellow-400 to-amber-500 text-slate-950 shadow-lg scale-105' 
                                            : 'bg-amber-950/80 text-amber-200 border border-amber-900 hover:bg-amber-900'
                                    }`}
                                >
                                    {tab.label} {tab.locked && isLockedUntilBirthday && '🔒'}
                                </button>
                            ))}
                        </nav>

                        {activeTab === 'home' && (
                            <div className="space-y-6">
                                <div className="relative h-64 md:h-96 rounded-3xl overflow-hidden border border-yellow-500/30 bg-amber-950 shadow-2xl">
                                    {bannerImages.map((img, idx) => (
                                        <div key={idx} className={`absolute inset-0 transition-opacity duration-1000 ${
                                            idx === currentBannerIndex ? 'opacity-100 z-10' : 'opacity-0 z-0 pointer-events-none'
                                        }`}>
                                            <img src={convertDriveLinkToDirect(img)} className="w-full h-full object-cover" />
                                            {isAdminUnlocked && (
                                                <button
                                                    onClick={() => {
                                                        const updated = bannerImages.filter((_, i) => i !== idx);
                                                        setBannerImages(updated);
                                                        saveBannerImagesToStorage(updated);
                                                    }}
                                                    className="absolute top-4 right-4 z-30 p-2 bg-red-600/90 text-white rounded-full text-xs font-bold"
                                                >
                                                    🗑️ Delete Photo
                                                </button>
                                            )}
                                        </div>
                                    ))}

                                    {isAdminUnlocked && (
                                        <div className="absolute top-4 left-4 z-20 flex gap-2">
                                            <button onClick={() => handleAddDriveLink('banner')} className="px-3 py-1.5 rounded-full bg-yellow-400 text-slate-950 text-xs font-bold">
                                                + Add Drive Photo 🔗
                                            </button>
                                        </div>
                                    )}

                                    <div className="absolute bottom-4 right-4 z-20 flex items-center gap-1.5 bg-amber-950/80 px-3 py-1.5 rounded-full border border-yellow-500/30 backdrop-blur-md">
                                        {bannerImages.map((_, idx) => (
                                            <button key={idx} onClick={() => setCurrentBannerIndex(idx)} className={`h-2 rounded-full transition-all ${idx === currentBannerIndex ? 'bg-yellow-400 w-5' : 'bg-amber-700 w-2'}`} />
                                        ))}
                                    </div>
                                </div>

                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    <div onClick={() => handleProtectedClick('letter', 'My Love Letter')} className="bg-amber-900/60 border border-yellow-500/30 p-6 rounded-3xl cursor-pointer hover:border-yellow-400 transition-all">
                                        <h3 className="text-lg font-bold text-white mb-1">My Love Letter 📜</h3>
                                        <p className="text-amber-200/80 text-xs">Read my handwritten animated Sinhala letter with background music!</p>
                                    </div>
                                    <div onClick={() => handleProtectedClick('gallery', 'Photo Gallery')} className="bg-amber-900/60 border border-yellow-500/30 p-6 rounded-3xl cursor-pointer hover:border-yellow-400 transition-all">
                                        <h3 className="text-lg font-bold text-white mb-1">Photo Gallery 🖼️ ({galleryPhotos.length} Photos)</h3>
                                        <p className="text-amber-200/80 text-xs">Our romantic album photos together.</p>
                                    </div>
                                </div>
                            </div>
                        )}

                        {activeTab === 'letter' && (
                            <SinhalaLetter isAdminUnlocked={isAdminUnlocked} letterBgMusic={letterBgMusic} setLetterBgMusic={setLetterBgMusic} />
                        )}

                        {activeTab === 'gallery' && (
                            <div className="space-y-6">
                                <div className="flex justify-between items-center bg-amber-900/60 p-6 rounded-3xl border border-yellow-500/30">
                                    <div>
                                        <h2 className="text-xl font-bold text-white">Photo Gallery 🖼️</h2>
                                        <p className="text-xs text-yellow-300">{galleryPhotos.length} Special Moments Loaded</p>
                                    </div>
                                    {isAdminUnlocked && (
                                        <button onClick={() => handleAddDriveLink('gallery')} className="px-4 py-2 bg-yellow-500 text-slate-950 font-bold text-xs rounded-xl">
                                            + Drive Link
                                        </button>
                                    )}
                                </div>
                                <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
                                    {galleryPhotos.map((photo) => (
                                        <div key={photo.id} className="h-56 rounded-2xl overflow-hidden border border-yellow-500/30 bg-amber-950 relative group">
                                            <img src={convertDriveLinkToDirect(photo.url)} className="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" />
                                            <div className="absolute inset-0 bg-gradient-to-t from-black/80 via-transparent to-transparent opacity-0 group-hover:opacity-100 transition-opacity p-3 flex flex-col justify-end">
                                                <span className="text-xs font-bold text-yellow-300">{photo.title}</span>
                                                <span className="text-[10px] text-amber-200">{photo.caption}</span>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {activeTab === 'openwhen' && (
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                {openWhenCards.map(c => (
                                    <div key={c.id} className="bg-amber-950/80 border border-yellow-500/30 p-5 rounded-2xl space-y-2">
                                        <span className="text-xs font-bold text-yellow-400 bg-yellow-500/10 px-3 py-1 rounded-full">{c.mood}</span>
                                        <h3 className="text-base font-bold text-white pt-2">{c.title}</h3>
                                        <p className="text-xs text-amber-100 bg-amber-900/40 p-3 rounded-xl">{c.text}</p>
                                    </div>
                                ))}
                            </div>
                        )}

                        {activeTab === 'music' && (
                            <div className="bg-amber-900/60 p-6 rounded-3xl border border-yellow-500/30 space-y-4">
                                <h2 className="text-xl font-bold text-white">Music & Voice Player 🎧</h2>
                                {userPlaylist.map(t => (
                                    <div key={t.id} className="bg-amber-950 border border-yellow-500/30 p-4 rounded-xl flex items-center justify-between">
                                        <span className="text-sm font-bold text-white">{t.title}</span>
                                        {t.audioUrl && <audio controls src={t.audioUrl} className="h-8" />}
                                    </div>
                                ))}
                            </div>
                        )}

                    </div>
                </div>
            );
        }

        function SinhalaLetter({ isAdminUnlocked, letterBgMusic, setLetterBgMusic }) {
            const letterText = `චූටි බබා,මට වෙන කරන්න දෙයක් මතක් වෙන්නෙ නෑ🙃 ...මම හිතනව මේ දෙයින් ඔයා සතුටු වෙයි කියල🙈 ...මම ඔයාට ආදරේ තරම කියාගන්න බෑ.❤️🥺🌍.මේ වෙලාවෙත් ඔයාගෙ birthday එකට වෙලාව ලං වෙද්දි මගෙ පපුව හයියෙන් ගැහෙනව.ඔයා තමයි මම හෙව්ව කෙනා කියල මට තේරුනේ ටික ටික අපි දෙන්න ආදරේ කරද්දි.මට ආදර කතා හිතල ලියන්න බෑ ඔයා වගේ 🥲.ඒත් මම ගොඩක් ආදරෙයි.❤️මට ඒක කියාගන්න තේරෙන්නෙ නෑ.ඔයාව මේ ලෝකෙ ලස්සනටම සතුටෙන්ම ඉන්න කෙල්ල කරන්නයි මට ඕන හැම තිස්සෙම.ඔයා ඇතුළෙ ඉන්න ඒ ලස්සන හුරතල් දඟකාර කෙල්ලට මම ආදරෙයි පිස්සුවෙන් වගේ.❤️🌍.මං දන්නව ඔයත් මට ගොඩක් ආදරෙයි.අපි දෙන්න අපි දෙන්නගෙ හීන ලස්සනට හැබෑ කරගමු මැණික ❤️🌍.මාව වැටෙන තැන් වලදි මට හයියක් වෙන කෙනෙක් මට ඔන උනේ 0 ඉඳන් හැම එකම හැබෑ කරගන්න.එතකන් මට හයියක් වෙන්න පුලුවන් කෙනෙක් මට හම්බුනා කියල හිතෙනව.මම ගොඩාආආආආඅක්ක් ආදරෙයි.අපි තව මේ වගේ ලස්සන උපන්දින ගොඩක් එකට සමරමු.❤️🌍I love my sunflower 🌻 .ummmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmaaaaaaaahhhhh.❤️❤️🌍`;
            const [displayed, setDisplayed] = useState('');
            const [idx, setIdx] = useState(0);

            useEffect(() => {
                if (idx < letterText.length) {
                    const t = setTimeout(() => {
                        setDisplayed(prev => prev + letterText[idx]);
                        setIdx(prev => prev + 1);
                    }, 35);
                    return () => clearTimeout(t);
                }
            }, [idx]);

            return (
                <div className="bg-amber-900/60 border border-yellow-500/40 p-6 rounded-3xl space-y-4">
                    <h2 className="text-2xl font-extrabold text-white text-center">To My Sunflower, Chuti 🌻</h2>
                    <div className="bg-amber-950/90 p-4 rounded-2xl flex items-center justify-between border border-yellow-500/30">
                        <span className="text-xs text-yellow-300 font-bold">Background Music 🎶</span>
                        {letterBgMusic && <audio controls autoPlay loop src={letterBgMusic} className="h-8" />}
                        {isAdminUnlocked && (
                            <label className="px-3 py-1.5 bg-yellow-500 text-slate-950 font-bold text-xs rounded-xl cursor-pointer">
                                🎵 Add Music
                                <input type="file" accept="audio/*" onChange={(e) => {
                                    const file = e.target.files[0];
                                    if (file) {
                                        const r = new FileReader();
                                        r.onloadend = () => {
                                            setLetterBgMusic(r.result);
                                            localStorage.setItem('chuti_letter_music', r.result);
                                        };
                                        r.readAsDataURL(file);
                                    }
                                }} className="hidden" />
                            </label>
                        )}
                    </div>
                    <div className="bg-amber-950/80 p-6 rounded-2xl text-amber-100 text-base leading-relaxed whitespace-pre-line font-medium">
                        {displayed}
                    </div>
                </div>
            );
        }

        function CountdownTimer({ targetMonth, targetDay }) {
            const [timeLeft, setTimeLeft] = useState({ days: 0, hours: 0, minutes: 0, seconds: 0 });

            useEffect(() => {
                const calculate = () => {
                    const now = new Date();
                    let target = new Date(now.getFullYear(), targetMonth - 1, targetDay);
                    if (now > target) target = new Date(now.getFullYear() + 1, targetMonth - 1, targetDay);
                    const diff = target - now;
                    if (diff > 0) {
                        setTimeLeft({
                            days: Math.floor(diff / (1000 * 60 * 60 * 24)),
                            hours: Math.floor((diff / (1000 * 60 * 60)) % 24),
                            minutes: Math.floor((diff / (1000 * 60)) % 60),
                            seconds: Math.floor((diff / 1000) % 60)
                        });
                    }
                };
                calculate();
                const timer = setInterval(calculate, 1000);
                return () => clearInterval(timer);
            }, []);

            return (
                <div className="flex justify-center gap-3 pt-2">
                    {[
                        { label: 'Days', val: timeLeft.days },
                        { label: 'Hours', val: timeLeft.hours },
                        { label: 'Mins', val: timeLeft.minutes },
                        { label: 'Secs', val: timeLeft.seconds }
                    ].map((item, i) => (
                        <div key={i} className="bg-amber-950 border border-yellow-500/40 p-3 rounded-2xl min-w-[70px] text-center">
                            <span className="text-xl font-extrabold text-yellow-400 block">{item.val}</span>
                            <span className="text-[10px] text-amber-200 font-bold uppercase">{item.label}</span>
                        </div>
                    ))}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
